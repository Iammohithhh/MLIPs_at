name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site — types, tests, build, links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/package-lock.json
      - run: npm ci
      - name: Type check (astro check)
        run: npm run check
      - name: Unit tests (physics numerics, geometry, content rules, contrast, TeX guards)
        run: npm test
      - name: Build (fails on any content-integrity problem) + Pagefind index
        run: npm run build
      - name: Internal links and anchors
        run: npm run check:links

  pipeline:
    name: Data pipeline — tests and up-to-date outputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Generated files are up to date
        run: |
          python -m atlas_pipeline.elements ../atlas/src/lib/structure/elements.generated.ts
          python -m atlas_pipeline.structures ../atlas/src/data/structures
          git diff --exit-code -- ../atlas/src/lib/structure/elements.generated.ts ../atlas/src/data/structures
