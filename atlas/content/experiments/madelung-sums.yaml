assumptions:
  - { term: System, value: 'Ideal rock-salt lattice of point charges ±1 e, nearest-neighbour distance r0 = 2.82 Å.' }
  - { term: Quantity, value: 'Madelung constant M, with E_i = −M k e²/r0 for every ion; computed live in the browser.' }
  - { term: Methods, value: 'Partial sums over spheres and cubes, Evjen-weighted cubes, and Ewald summation (α = 1.2/r0).' }
