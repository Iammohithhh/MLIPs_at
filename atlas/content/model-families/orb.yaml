name: Orb
aliases: [Orb-v2, Orb-v3]
paradigms: [learned-equivariance, foundation, fast-deployment]
introduced_in: neumann2024orb
year: 2024
summary: >-
  A Graph Network Simulator whose edges carry ordinary (non-equivariant) features of the bond vector and whose messages
  are gated by a sigmoid times a smooth distance envelope; rotational symmetry is learned from rotated data and, in
  Orb-v3, encouraged by penalising the energy's derivative with respect to an infinitesimal rotation (Equigrad).
locality: { kind: message-passing, note: 'Orb-v3: 6 Å, at most 20 or 120 neighbours per atom, 5 message-passing steps; Orb-v2: 15 steps, 20 neighbours.' }
symmetry: learned
body_order: Unrestricted (MLP node and edge updates).
implementations: [orb-models]
claims: [orb-gns-architecture, orb-v3-edge-basis, orb-direct-forces-augmentation, orb-v3-variants, orb-v3-neighbour-limit, orb-neighbour-limit-ties, orb-equigrad, equigrad-net-torque, orb-v3-energy-drift, orb-v3-omat-aimd-only, representation-orb-rotation]
review: { status: draft, last_checked: 2026-10-16, notes: 'Architecture details read from the arXiv HTML of both papers and from orb-models at commit 1794f85 (2026-09-26).' }
