claims: [orb-v3-variants, orb-v3-omat-aimd-only, orb-v3-energy-drift]
review:
  status: draft
  last_checked: 2026-10-16
  notes: 'Forces and stress by back-propagation; up to 120 neighbours within 6 Å (pretrained.py). "other" output = per-atom confidence head (binned force-error prediction). The paper gives ~25M parameters for the 5-layer model (App. C), not a per-checkpoint count. The v3 report says Orb-v3 shares Orb-v2''s denoising-diffusion pretraining scheme but does not itemise the pretraining data, so no pretraining stage is recorded.'
