name: orb-v3-conservative-inf-omat
family: orb
implementation: orb-models
version: '20250404'
release: { date: 2025-04-04, source: rhodes2025orbv3 }
training:
  - stage: training
    dataset: omat24
    level_of_theory: pbe-pbeu-omat24
    note: 'AIMD subset of OMat24 only (rattled structures excluded); energies, forces and stress, Huber loss.'
outputs: [energy, forces, stress, other]
licence: Apache-2.0
weights: { url: 'https://orbitalmaterials-public-models.s3.us-west-1.amazonaws.com/forcefields/orb-v3/orb-v3-conservative-inf-omat-20250404.ckpt' }
