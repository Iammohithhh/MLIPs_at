review:
  status: draft
  last_checked: 2026-10-17
  notes: 'Downloaded and read by the Atlas pipeline (pipeline/atlas_pipeline/xray_nequip.py) without executing the package: r_c 4.5 Å, 8 trainable Bessel functions, polynomial cutoff p = 5, 32-dimensional type embedding, two layers with hidden irreps 128x0e+64x1e then 128x0e, edge harmonics 1x0e+1x1e, average neighbour count 25.59, per-type scales and shifts and a ZBL pair term; 616,360 trainable parameters counted on the rebuilt model (Table 1 of the paper: 0.6 M). Packaged with nequip 0.15.0, e3nn 0.5.6 and torch 2.7.0 (package_metadata.txt). Release date from nequip.net; Zenodo lists the packages under version 0.1a.'
