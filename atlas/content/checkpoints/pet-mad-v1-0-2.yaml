  notes: 'Parameter count is the paper''s "approximately 3.3 million" (Sec. II B). The archived pet-mad repository calls v1.0.2 the stable model for reproducing the paper; v1.1.0 (non-conservative forces and stresses) is marked dev. Development moved to github.com/lab-cosmo/upet (PET-MAD-1.5/1.6 at r2SCAN, PET-OAM, PET-OMat, ...), not recorded here yet.'
