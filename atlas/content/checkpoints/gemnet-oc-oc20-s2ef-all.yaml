name: GemNet-OC OC20 S2EF (All)
family: gemnet
implementation: ocp
version: gemnet_oc_base_s2ef_all.pt
release: { source: gasteiger2022gemnetoc }
training:
  - stage: training
    dataset: oc20
    level_of_theory: rpbe-oc20
    note: Base model trained on the S2EF "All" split of OC20; forces predicted directly, not as energy gradients.
outputs: [energy, forces]
licence: Not stated for the weights (repository code MIT; OC20 data CC BY 4.0)
weights: { url: 'https://dl.fbaipublicfiles.com/opencatalystproject/models/2022_07/s2ef/gemnet_oc_base_s2ef_all.pt' }
known_issues: [gemnet-forces]
review:
  status: draft
  last_checked: 2026-10-18
  notes: 'Listed in fairchem (src/fairchem/core/models/pretrained_models.yml at tag fairchem_core-1.3.0, docs/core/model_checkpoints.md) as GemNet-OC-S2EF-OC20-All; config configs/s2ef/all/gemnet/gemnet-oc.yml with a separate scaling-factor file. All+MD and Large variants are also listed. URL answered with a content length on 2026-10-18. Validation metrics not copied.'
