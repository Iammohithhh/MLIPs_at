statement: >-
  Decomposing the species indices of the expansion coefficients moves all chemistry into species-dependent radial
  functions R^(t)_{μ_j n l}(r), so the number of expansion coefficients no longer grows combinatorially with the number of
  elements; the foundation models embed the 89 elements into a 128-dimensional space.
