statement: >-
  On a grain-boundary energy benchmark for pure metals, almost all foundation models tested, GRACE included, have larger
  relative errors for K, Rb and Cs; the authors suggest that the usual 6 Å cutoff is too small for these large alkali atoms.
grade: PUBLISHED_RESULT
