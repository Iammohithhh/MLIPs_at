statement: >-
  Summing a product basis Φ_v = Π_t φ_{v_t}(r_{j_t i}) over all ν-tuples of neighbours equals the product of the
  atomic-base sums, Π_t A_{i v_t} with A_{iv} = Σ_j φ_v(r_ji), so a ν-body term costs time linear in the number of
  neighbours and linear in ν instead of growing as N^ν.
