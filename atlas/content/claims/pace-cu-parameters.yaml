statement: >-
  The Cu PACE potential has 2072 parameters, of which 756 are expansion coefficients for each of its two densities and
  560 parametrise the radial functions; its cutoff of 7.4 Å was chosen because DFT interactions between rigidly
  separated slabs fall below 1 meV beyond it. The released file holds 742 basis functions per density.
grade: PUBLISHED_RESULT
sources:
