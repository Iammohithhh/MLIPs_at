statement: >-
  In SevenNet's spatial decomposition each processor keeps ghost atoms only within r_c of its subdomain. Ghost positions and
  species are sent once; after every message-passing layer except the last, ghost node features are sent forward; on the
  reverse path, energy gradients with respect to ghost node features (T − 1 times) and ghost partial forces (once) are
  sent back to the owners. The parallel model does not change the outputs of the serial NequIP model.
grade: PUBLISHED_RESULT
