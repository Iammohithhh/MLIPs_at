statement: >-
  In a 4G-HDNNP, atomic neural networks predict electronegativities χ_i from symmetry functions; the charges are the minimum of
  E_Qeq = E_elec + Σ_i (χ_i Q_i + ½ J_i Q_i²) for Gaussian charges of width σ_i (covalent radii) at fixed total charge, found from
  one linear system with a Lagrange multiplier. The charges therefore depend on the positions, composition and total charge of the
  whole system.
grade: THEORY
