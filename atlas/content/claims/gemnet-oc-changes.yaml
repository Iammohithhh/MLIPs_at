statement: >-
  GemNet-OC builds its graphs from a fixed number of nearest neighbours instead of a distance cutoff (at most 30, and 8
  for quadruplet interactions, within 12 Å), decouples the radial from the angular basis and replaces spherical
  harmonics by products of Legendre polynomials, and adds atom-to-atom, atom-to-edge and edge-to-atom interactions so
  that cheap medium-range messages complement the expensive short-range quadruplets.
grade: PUBLISHED_RESULT
