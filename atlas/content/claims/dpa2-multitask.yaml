statement: >-
  DPA-2 pre-trains one descriptor on many datasets at once with a separate fitting network per dataset: the descriptor is
  updated by every dataset, each fitting network only by its own, because labels computed with different functionals, basis
  sets and cut-offs describe different potential energy surfaces and cannot be merged into one dataset.
