statement: >-
  LES adds E_lr = (2π/V) Σ_{0<|k|<k_c} e^{−σ²k²/2} |S(k)|²/k² to a short-range energy, with S(k) = Σ_i q_i e^{ik·r_i} and latent
  charges q_i = Q_φ(B_i) predicted from each atom's invariant features. The charges are not trained to reference charges and not
  constrained to a total charge; omitting k = 0 (tinfoil boundary conditions) keeps a non-zero net charge from diverging, and no
  self-interaction term is subtracted. σ is typically 1 Å.
grade: THEORY
