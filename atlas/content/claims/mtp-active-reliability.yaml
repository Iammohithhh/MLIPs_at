statement: >-
  For MD of bulk Li near melting, an MTP trained on a fixed database escaped into unphysical configurations about every
  15 ps, a classical learn-on-the-fly scheme raised this to about 150 ps at the cost of about 1,500 extra DFT
  calculations, and active learning on the fly ran an effective 0.5 µs (parallel replica) without a failure with about
  50 extra DFT calculations.
grade: PUBLISHED_RESULT
