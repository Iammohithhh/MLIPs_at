statement: >-
  Allegro carries invariant and equivariant features on ordered pairs ij; each layer updates them with a tensor
  product of the pair features and the spherical harmonics of every neighbour k of i (summed into one embedded
  environment), weighted by learned functions of earlier scalar pair features; the energy is a sum of pair energies.
