statement: >-
  The NequIP foundation models come in four sizes: Small (4.5 Å cutoff, l_max = 1, 128 and 64 features, 2 layers,
  0.6 M parameters), Medium (6 Å, l_max = 2, 4 layers, 3.2 M), Large (6 Å, l_max = 3, 6 layers, 6.8 M) and
  Extra-Large (6 Å, l_max = 4, 6 layers, 32.1 M).
