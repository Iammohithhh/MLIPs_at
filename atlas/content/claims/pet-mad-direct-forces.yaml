statement: >-
  Besides back-propagated (conservative) forces, PET-MAD trains a separate head that predicts forces directly; skipping
  back-propagation makes it two to three times faster but violates energy conservation, and the authors recommend a
  multiple-time-step integrator to keep the speed without sampling artefacts.
