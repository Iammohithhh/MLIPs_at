statement: >-
  For a conservative model of an isolated system, Δ_rot is antisymmetric and its three independent entries are minus
  the components of the net torque Σ_i r_i × F_i, so the Equigrad penalty is a penalty on the spurious torque a
  non-invariant energy exerts.
grade: THEORY
derivation: /models/orb/#equigrad-derivation
