statement: >-
  Elastic constants, second derivatives of the energy that no evaluated model was trained on, are predicted with
  20–25% MAPE for C₁₁ by the stable models (MACE, SevenNet, MatterSim, UMA, MACE-OMat) and worse for the shear
  components C₄₄ and C₆₆; Orb, which predicts forces directly rather than as energy gradients, exceeds 80% on every
  component, reaching 100% for C₆₆.
