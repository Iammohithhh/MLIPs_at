statement: >-
  Simulating electrochemical charge-transfer barriers in cells with a fixed number of electrons gives large shifts of
  the electrode potential along the reaction path; Chan and Nørskov obtain constant-potential energetics from a single
  barrier calculation plus the surface charges of the initial, transition and final states.
