statement: >-
  On 1,497 elemental surfaces from the Materials Project (73 elements), the universal potentials M3GNet
  (2021.2.8-DIRECT), CHGNet (v0.3.0) and MACE (2024.01.07, 128 channels, L = 2) mostly underestimate the surface energy
  relative to the DFT reference, with few overestimates; the authors relate this to the softening reported by Deng et al.
