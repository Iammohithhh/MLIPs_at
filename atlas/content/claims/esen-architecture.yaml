statement: >-
  eSEN embeds nodes as multi-channel spherical-harmonic features; each block applies an edgewise convolution (source and
  target features concatenated, two eSCN SO(2) convolutions with a nonlinearity between them, multiplied by an envelope)
  and a nodewise feed-forward network of equivariant linear layers with a gated SiLU nonlinearity, without projecting
  onto spatial grids; energy is the sum of per-atom l = 0 outputs and forces and stress are its derivatives.
