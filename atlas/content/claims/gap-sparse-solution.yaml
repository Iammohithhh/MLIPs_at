statement: >-
  GAP is a sparse Gaussian process: a set S of representative environments is chosen and the prediction is
  ε*(d*) = k*ᵀ (C_SS + C_ST Λ⁻¹ C_TS)⁻¹ C_ST Λ⁻¹ t, where Λ holds the expected error of each observation (scaled with
  the number of atoms for energies). The cost of a prediction grows with the number of sparse points, not with the
  amount of data, and a small jitter is added to C_SS.
grade: PUBLISHED_RESULT
