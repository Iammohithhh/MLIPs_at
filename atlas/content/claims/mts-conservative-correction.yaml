statement: >-
  Multiple time stepping — integrating with direct forces and applying a conservative-force correction every M steps —
  gives NVE results essentially indistinguishable from fully conservative ones at M = 8, and reduces the cost of the
  conservative trajectory from a factor F to 1 + (F − 1)/M relative to direct forces.
