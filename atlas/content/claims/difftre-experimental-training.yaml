statement: >-
  Differentiable trajectory reweighting (DiffTRe) trains neural-network potentials directly on experimental observables
  without differentiating through the MD trajectory, shown for an atomistic model of diamond and a coarse-grained
  water model using thermodynamic, structural and mechanical targets.
