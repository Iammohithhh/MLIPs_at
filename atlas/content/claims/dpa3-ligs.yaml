statement: >-
  DPA-3 passes messages on the line-graph series G(1), G(2), ...: bonds of G(1) are the vertices of G(2), angles its edges, and
  dihedrals the edges of G(3). Bond features start from an embedding of the distance and angle features from an embedding of
  cos θ; the vertex feature of G(k) is the edge feature of G(k−1), and the final atom features of G(1), with a dataset encoding,
  give E_i = F(v_i, c(D_m)) + e_m(Z_i).
grade: THEORY
