statement: >-
  The authors of LES state that predicting charges locally works well empirically but lacks theoretical guarantees and may meet
  its limits in edge cases such as long-range charge transfer, and that the sign of all latent charges is not determined because
  E_lr depends on |S(k)|².
grade: THEORY
