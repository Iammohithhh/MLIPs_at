statement: >-
  For E_qm(x) = x² + x³ e^{−x²/2} on [−4, 4] and the model θ₁x² + θ₂x³, the fit to Boltzmann-sampled MD at kT = 1 is
  0.93x² + 0.21x³ (RMS error 0.25) and has a spurious barrier near x = −3 beyond which the system can escape; the
  D-optimal pair x = ±4 gives x² + 3 × 10⁻⁴ x³, a larger RMS error (0.46) but the correct barriers at the edges.
grade: REPRODUCED
