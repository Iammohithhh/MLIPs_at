statement: >-
  A single SpookyNet update resolves angular information up to l = 2 (s-, p- and d-like functions); the authors report
  that with one message-passing step it distinguishes their environment pairs A and B but not C, D and E, that all five
  pairs become distinguishable with two or more steps, and that adding f- or g-like interactions gave little benefit in
  accuracy for the extra cost.
