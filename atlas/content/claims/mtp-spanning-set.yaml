statement: >-
  The basis functions B_α, full contractions of products of moment tensors encoded by a symmetric integer matrix α,
  form a spanning set of the polynomials invariant to permutations and to rotations and reflections (Theorem 3.1); the
  representation of a given polynomial is in general not unique, so the B_α are linearly dependent.
