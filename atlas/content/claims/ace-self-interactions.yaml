statement: >-
  The sum over all neighbour tuples in a product of atomic-base functions includes tuples in which a neighbour
  repeats; these self-interaction terms are lower-order functions, and ACE drops them from the order-ν basis and
  absorbs them into the order-(ν − 1) basis instead of subtracting them.
