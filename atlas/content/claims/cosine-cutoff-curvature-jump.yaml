statement: >-
  The cosine cutoff f_c(r) = ½[cos(πr/r_c) + 1] and its first derivative vanish at r_c, but its second derivative
  tends to π²/(2r_c²) from below and is zero beyond r_c: the curvature is discontinuous at the cutoff.
