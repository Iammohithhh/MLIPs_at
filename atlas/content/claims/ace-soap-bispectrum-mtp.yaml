statement: >-
  The SOAP power spectrum is a sub-basis of the ACE functions of correlation order ν ≤ 2 (three-body), the SNAP
  bispectrum can be written exactly as ν = 3 (four-body) ACE functions, and suitably chosen finite sets of moment
  tensor and ACE basis functions span the same space.
