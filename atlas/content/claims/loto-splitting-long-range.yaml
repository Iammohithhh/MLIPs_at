statement: >-
  In a polar crystal the long-range macroscopic field adds a non-analytic term to the dynamical matrix as q → 0, which
  separates longitudinal from transverse optical modes at Γ, ω_LO² − ω_TO² = 4πk(Z*)²/(Ωμε∞) for a diatomic cubic
  crystal; force constants of finite range give a dynamical matrix analytic at Γ, so in a cubic crystal a strictly local
  model has LO = TO at Γ for any cutoff.
grade: THEORY
sources:
