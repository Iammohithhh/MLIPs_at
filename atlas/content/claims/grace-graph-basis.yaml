statement: >-
  Graph ACE builds cluster basis functions on tree graphs whose directed edges carry single-particle functions
  R_nl(r) Y_lm(r̂) that vanish beyond the cutoff; local ACE is the subset of star graphs, all edges leaving one atom.
  The two are identical up to three-body interactions and differ from four-body interactions onward.
grade: PUBLISHED_RESULT
