statement: >-
  In MLIP-driven simulations of Ag(111)/water, the angle between the water bisector (dipole) and the surface normal for
  interfacial water (within 5 Å of Ag) peaks near 55° at the potential of zero charge and near 135° at −1.5 V vs SHE,
  where interfacial water turns "H-down" towards the negatively charged surface.
grade: PUBLISHED_RESULT
