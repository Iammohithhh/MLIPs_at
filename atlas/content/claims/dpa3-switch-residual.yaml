statement: >-
  DPA-3's switch s(r) = exp(−exp(C(r − r_cs)/r_cs)) is not zero at r_c: with C = 20, r_cs = 5.3 Å and r_c = 6.0 Å it is
  exp(−exp(20 · 0.7/5.3)) ≈ 8 × 10⁻⁷ there, so the weight steps to zero by that amount.
