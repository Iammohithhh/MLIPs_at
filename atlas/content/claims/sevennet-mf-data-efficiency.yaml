statement: >-
  For Li₆PS₅Cl, a multi-fidelity model trained on PBE data plus SCAN single points that added 10–20 % to the PBE cost gave
  Li-ion conductivities within 10 % of a model trained on a full SCAN dataset, while a model trained on the SCAN subset alone
  deviated and formed short Li–Li bonds above 600 K. For InₓGa₁₋ₓN with r²SCAN data only for the binaries, multi-fidelity
  mixing energies of unseen alloys reached R² = 0.98 against a high-fidelity model, versus −4.55 for transfer learning and
  0.31 for Δ-learning.
