statement: >-
  AIMNet2 builds atom features from 16 Gaussian radial basis functions with a cosine cutoff at 5 Å, combined with learned 16 × 16 element embeddings, using harmonics with l = 0 and l = 1 only; the l = 1 part is mixed over shells by a learned linear map and reduced by a vector norm. From the second pass on, the charges enter through the same convolution.
