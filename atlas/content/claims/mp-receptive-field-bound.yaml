statement: >-
  After T message-passing layers on a graph whose edges join atoms closer than the cutoff r_c, atom i can only be
  influenced by atoms within T graph hops; every such atom lies closer than T·r_c, so the receptive field is a
  subset of the ball of radius T·r_c (often a strict subset).
grade: THEORY
