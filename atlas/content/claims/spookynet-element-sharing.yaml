statement: >-
  Because the queries of SpookyNet's charge and spin embeddings are a linear function of the nuclear embedding e_Z alone,
  the share of Q (or S) that each atom receives depends only on its element and on how many atoms of each element the
  structure contains, not on the geometry. Two identical fragments therefore always receive Ψ/2 each, at any separation.
grade: THEORY
derivation: /models/spookynet/#embedding
scope: { model_families: [spookynet] }
