statement: >-
  On Li/Na cathode migration barriers (layered, olivine and maricite frameworks), the Orb-v3 checkpoints reach mean
  absolute errors of 75–111 meV against DFT, with the non-conservative direct variants (75–100 meV) slightly ahead of the
  conservative ones (106–111 meV).
