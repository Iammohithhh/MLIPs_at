statement: >-
  For CO2 reduction at Ag(111)/water, Tian et al. trained two separate sets of MACE (v0.3.4) potentials, one at the
  potential of zero charge and one at a constant potential of −1.5 V vs SHE, each reproducing grand-canonical DFT
  (r2SCAN + rVV10, implicit-solvent charging) energies and forces at that potential; they describe fitting one model per
  electrode potential as a practical strategy and a model spanning a continuous potential range as desirable.
