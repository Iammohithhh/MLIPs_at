statement: >-
  On the Atlas reference set, the invariant features of MACE-MP-0a medium and small have a markedly higher linear CKA with each
  other than either has with the same architecture left untrained, and after the anchor transform the small model's 2D map aligns
  with the medium map far better than the untrained model's does (values on the page, read from the precomputed file).
