statement: >-
  For a specific chemical system, rescaling a universal model's energy by one scalar fitted to a single high-energy
  configuration (a single force component) largely removes the softening locally — e.g. CHGNet's softening scale
  rises from 0.859 to 0.965 in the paper's example. It is a local correction, not a global fix.
