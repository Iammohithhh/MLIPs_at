statement: >-
  For a smooth Hamiltonian, the total energy along a Störmer–Verlet (velocity Verlet) trajectory with step h stays
  within C·h² of its initial value over very long times; the constants depend on bounds of derivatives of the
  Hamiltonian, so the guarantee needs a smooth potential.
grade: THEORY
sources:
