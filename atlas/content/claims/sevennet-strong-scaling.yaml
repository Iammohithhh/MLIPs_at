statement: >-
  In fixed-size tests (12,960 atoms of α-quartz), the 32-channel models reached speed-ups of 13.1–15.4 on 32 GPUs, and the
  4-channel, 2-layer model stopped gaining beyond 4 GPUs; the authors attribute the saturation to under-utilised GPUs as the
  atoms per GPU fall.
