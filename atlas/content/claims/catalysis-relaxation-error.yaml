statement: >-
  Relaxing adsorbed formate on metal-supported oxide nanoclusters into each potential's own local minimum increases the
  adsorption-energy error for all models compared with evaluating DFT-relaxed geometries (1.6× for eSEN-30M-OAM), and the
  RMSE does not fall below about 0.18 eV for any model after relaxation.
