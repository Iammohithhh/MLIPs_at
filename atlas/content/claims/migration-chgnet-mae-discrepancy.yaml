statement: >-
  For CHGNet on the 574 DFT-NEB barriers, the under/over-estimate counts recomputed from the released data match the
  paper (420/154), but the mean absolute error comes out at 0.335 eV rather than the published 0.343 eV; for MACE-MP-0
  only 496 of 574 per-system barriers are released, giving 0.304 eV on that subset against 0.310 eV published for all 574.
