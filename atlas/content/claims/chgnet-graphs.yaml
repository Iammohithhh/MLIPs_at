statement: >-
  CHGNet builds an atom graph with a 5 Å cutoff and a bond graph with a 3 Å cutoff whose nodes are bonds and whose
  edges are the angles between bonds sharing an atom; distances are expanded in trainable smooth radial Bessel
  functions and angles in a Fourier basis, and three interaction blocks update atoms, bonds and angles before a final
  atom convolution, with 64-dimensional features (400,438 trainable parameters in the paper's model).
