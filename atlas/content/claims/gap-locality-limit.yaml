statement: >-
  A strictly local model cannot have a force error below the variation of the true force caused by atoms outside its
  cutoff. The 2010 GAP letter estimates this floor for C, Si and Ge; the 2018 Si paper quotes earlier work that a 5 Å
  cutoff implies errors of about 0.1 eV/Å in diamond Si and argues that the locality error is larger for metallic β-Sn.
