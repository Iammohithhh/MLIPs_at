statement: >-
  In an ablation on high-entropy-alloy data, the type embedding and the attention layers substantially improved DPA-1's accuracy
  over DeepPot-SE, while the angular gate R̂ R̂ᵀ gave a smaller but not negligible improvement; replacing the network embedding
  with Gaussian kernels lowered accuracy slightly and made the model non-smooth under periodic boundary conditions.
