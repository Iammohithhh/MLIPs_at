statement: >-
  Coupled to the nudged elastic band method without fine-tuning, five foundation potentials predict 574 literature
  DFT-NEB ion-migration barriers (up to 2.5 eV) with mean absolute errors of 0.310 eV (MACE-MP-0 large), 0.336 eV
  (Orb-v3), 0.343 eV (CHGNet), 0.344 eV (SevenNet) and 0.349 eV (M3GNet); typical DFT-NEB error is about 60 meV.
