statement: >-
  Star graphs (local ACE) span at most twice the cutoff, between two neighbours of the root, while tree graphs can extend
  over several cutoff distances along chains of edges each shorter than the cutoff; the authors argue that trees with
  large angles and comparable edge lengths are also more sensitive to small displacements than stars on the same atoms.
