statement: >-
  On the four datasets of Ko et al. (C₁₀H₂/C₁₀H₃⁺, Na₈/₉Cl₈⁺, Ag₃⁺/⁻, Au₂ on Al-doped MgO(001)), SpookyNet reported lower
  energy, force and charge RMSEs than the 2G-, 3G- and 4G-BPNN values reported by Ko et al.; the BPNN numbers were taken
  from that paper, not retrained, and both use the same data settings.
grade: PUBLISHED_RESULT
