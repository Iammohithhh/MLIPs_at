statement: >-
  Each moment tensor is a linear combination of ACE's atomic-base functions A_{μνlm} with radial part f_μ(r) r^ν, so
  suitably chosen finite sets of MTP and ACE basis functions span the same space, and completeness results transfer
  between the two constructions.
