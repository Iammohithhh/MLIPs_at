statement: >-
  GemNet computes forces as −∂E/∂x by default, which guarantees a conservative force field, and has direct-force
  variants (GemNet-dT, GemNet-dQ); GemNet-OC predicts forces directly in all its OC20 models because gradient-based
  training on that dataset was reported to be numerically unstable, so its forces are not conservative.
grade: PUBLISHED_RESULT
sources:
