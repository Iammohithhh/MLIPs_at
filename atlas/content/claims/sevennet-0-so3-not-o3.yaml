statement: >-
  SevenNet-0 (11Jul2024) was trained with is_parity: False, so its spherical harmonics carry no parity (1x0e+1x1e+1x2e)
  and the network is equivariant under rotations (SO(3)) but not reflections: its scalar features distinguish an
  environment from its mirror image, e.g. the two mirror-related methylene hydrogens of ethanol.
grade: THEORY
derivation: /models/representation-map/#invariance-h
scope: { model_families: [sevennet], checkpoints: [sevennet-0-11jul2024] }
review: { status: draft, last_checked: 2026-10-17, notes: 'is_parity: False in sevenn/pretrained_potentials/SevenNet_0__11Jul2024/pre_train.yaml (main branch); the edge spherical-harmonic irreps 1x0e+1x1e+1x2e read from the loaded model (sevenn 0.13.0). Mirror-image feature differences computed on the Representation Map (precomputed on CPU). The total energy of mirrored ethanol changed by 4e-6 eV in float32, i.e. the readout is nearly but not exactly blind to handedness.' }
