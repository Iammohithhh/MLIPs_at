statement: >-
  The NeurIPS SchNet uses three interaction blocks with 64 features and Gaussian centres from 0 to 30 Å; the JCP
  paper uses six blocks for QM9 and Materials Project, three for MD17, 64 features, and a 5 Å cutoff only for the
  periodic Materials Project crystals.
