statement: >-
  Orb-v1/v2 predict forces and stress with separate decoder heads rather than as gradients of the energy, so the force
  field is not conservative, and they are only approximately rotation-invariant/equivariant, through random-rotation
  augmentation during training; predicted forces have their mean subtracted, and for non-periodic systems the net torque
  is removed.
