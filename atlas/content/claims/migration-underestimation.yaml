statement: >-
  Underestimated migration barriers are the common error for older or MPtrj-only universal potentials: CHGNet and
  M3GNet underestimate 73.1% and 78.2% of 574 barriers, while MACE-MP-0, SevenNet and Orb-v3 are roughly balanced; in a
  separate Li/Na cathode benchmark, models trained only on MPtrj consistently underestimate barriers.
