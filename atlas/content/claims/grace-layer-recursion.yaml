statement: >-
  Writing tree expansion coefficients as products of star coefficients (tensor decomposition) lets a tree and all its
  subtrees be evaluated by a downward recursion of local ACEs: on each layer an atomic base sums neighbour functions
  weighted by the neighbours' local-ACE outputs from the layer above. A model with T layers evaluates trees of depth up to
  T, which the authors identify with message passing, multi-ACE and MACE.
