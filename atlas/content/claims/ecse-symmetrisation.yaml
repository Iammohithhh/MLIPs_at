statement: >-
  ECSE makes any smooth, permutation- and translation-invariant backbone exactly rotationally equivariant by evaluating
  it in the local frame of every ordered pair of neighbours (r̂_j, r̂_j × r̂_j′ normalised, and their cross product) and
  taking a weighted average with w_jj′ = f_c(r_j) f_c(r_j′) q_c(|r̂_j × r̂_j′|²), which removes frames of atoms crossing
  the cutoff and of nearly collinear pairs and so keeps the result smooth; a plain average would be discontinuous.
grade: PUBLISHED_RESULT
