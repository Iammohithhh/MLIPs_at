statement: >-
  For transition-state formation energies of CO₂ hydrogenation steps on doped ZrO₂(101), linear scaling relations fitted
  to that data set are about three times as accurate as the best zero-shot foundation potential, although each relation
  covers only one reaction step and its error is a training error.
