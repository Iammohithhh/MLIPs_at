statement: >-
  GemNet's universality results (Theorems 2 and 3) show that rotationally equivariant functions can be approximated
  with representations on the S² sphere, for configurations whose relative vectors do not all lie in a plane; the
  paper notes that a discretised mesh may not keep the guarantee, so the results do not prove that the practical model
  with cutoffs is universal.
