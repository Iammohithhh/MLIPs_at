statement: >-
  DPA-2 and DPA-3 add a per-element energy bias to every atomic energy, fitted by least squares from the compositions and total
  energies of the training frames (one bias per dataset in DPA-3), to absorb the arbitrary energy zero of each DFT setup.
grade: THEORY
