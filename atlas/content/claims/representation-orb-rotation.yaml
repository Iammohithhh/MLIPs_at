review: { status: draft, last_checked: 2026-10-17, notes: 'Read from the arXiv v1 HTML. The Atlas Representation Map measures the same effect for Orb v2 (MPtrj only) on its own reference set; that is a separate, precomputed result, not this paper''s.' }
