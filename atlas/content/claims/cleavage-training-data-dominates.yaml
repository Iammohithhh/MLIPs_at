statement: >-
  In a benchmark of 19 universal potentials on 36,718 PBE cleavage energies of metallic slabs (single points at fixed DFT
  geometries, Miller indices up to 1), the same architecture's median absolute percentage error changes several-fold with
  its training data: eSEN-30M 2.9% (OMat24) vs 14.7% (MPtrj); MACE 6.1% (OMat24) vs 24.6% (MACE-MP-0b3); GRACE-2L 6.9%
  vs 13.6%; EquiformerV2 3.7% (OMat24) vs 62.7% (OC20).
grade: PUBLISHED_RESULT
