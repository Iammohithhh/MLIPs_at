statement: >-
  SevenNet-MF one-hot encodes the fidelity of each database as l = 0 (0e) features and concatenates them to the scalar input
  of the linear layers (atom-type embedding, self-interaction layers in the interaction blocks, first linear layer of the
  output block), with fidelity-dependent weights initialised to zero, and uses a separate atomic energy shift and scale per
  fidelity. The convolutions are unchanged, so the parallel algorithm applies without modification.
grade: PUBLISHED_RESULT
sources:
