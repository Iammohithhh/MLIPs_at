statement: >-
  The union of the rotation- and permutation-invariant ACE bases of all orders is linearly independent, and its span
  is dense in the smooth symmetric functions of the neighbour positions inside the cutoff, so a truncated ACE can
  approximate any such site energy arbitrarily well as the order and degree grow.
