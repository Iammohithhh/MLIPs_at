statement: >-
  PET-MAD imposes no rotational constraint and learns equivariance from data augmentation; its authors measured the
  residual symmetry breaking as the standard deviation of the energy over rotations on an order-9 Lebedev–Laikov grid,
  for every MAD subset, and report it alongside Orb-v2's in their Fig. 2 (right panel).
