statement: >-
  Among the Orb-v3 models only orb-v3-conservative-inf is truly energy-conserving in NVE dynamics: the direct-force
  models are not gradients of a scalar (direct-inf has continuous forces), and orb-v3-direct-20, which is both
  non-conservative and slightly discontinuous through its neighbour limit, shows the largest energy drift.
