statement: >-
  Three-body descriptors do not determine an atomic environment: two environments with four neighbours on a circle can
  share the list of distances and angles (45°, 45°, 90°, 135°, 135°, 180°) without being related by rotation or
  reflection, and so have the same SOAP power spectrum. For four or more neighbours such pairs form manifolds of
  codimension 2; the bispectrum lifts this example but is itself incomplete. A GPR model on the C-centred power spectrum
  of CH4 has large errors near the degenerate manifold.
grade: PUBLISHED_RESULT
sources:
  - { paper: pozdnyakov2020completeness, locator: 'arXiv v2, Fig. 1a–b, Figs. 2–3 and text' }
scope: { model_families: [gap, behler-parrinello] }
verified_against: full-text
review: { status: draft, last_checked: 2026-10-17, notes: 'The circle pair is rebuilt on the GAP page (Fig. 3) with positions {0,1,3,4} and {0,1,2,5} × 45°; identical power spectra and different bispectra are tested in src/lib/models/soap.test.ts.' }
