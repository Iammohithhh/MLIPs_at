statement: >-
  For C10H2 and C10H3+ with a 4.23 Å cutoff, the atoms in the left half of the chain have nearly identical environments in both
  molecules but different DFT (Hirshfeld) charges; the 3G-HDNNP assigned them nearly identical charges (rescaling to the total
  charge did not help), while the 4G-HDNNP reproduced the DFT charges, with lower energy, charge and force errors than the 2G- and
  3G-HDNNPs for both molecules.
