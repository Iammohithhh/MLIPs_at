statement: >-
  On the tungsten database of the W GAP (9,693 configurations), an MTP with about as many basis functions as the GAP
  fitted forces about 1.5 times better at about 40 times lower CPU time per atom, and a sparser MTP (760 basis
  functions) matched the GAP's force error at more than two orders of magnitude lower cost (single-core laptop timings,
  excluding neighbour lists).
