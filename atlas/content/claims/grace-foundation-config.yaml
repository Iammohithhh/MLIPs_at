statement: >-
  The GRACE foundation models use a 6 Å cutoff, 8 or 10 Chebyshev radial functions transformed by an MLP, spherical
  harmonics up to l = 4, a 128-dimensional chemical embedding and product order 4. Their parameter counts are 3.4 M
  (1L), 4.5 M (1L-medium), 9.0 M (1L-large), 12.6 M (2L), 21.8 M (2L-medium) and 26.4 M (2L-large); energies are
  computed in double precision and forces are energy gradients.
grade: PUBLISHED_RESULT
sources:
