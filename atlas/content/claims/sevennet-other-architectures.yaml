statement: >-
  The communication scheme applies to message-passing models with two-body message functions (SchNet, PhysNet, PaiNN,
  NequIP, MACE) after adapting the force computation; models with explicit three-body terms such as M3GNet, CHGNet, ALIGNN
  and DimeNet would also need edge features and their gradients exchanged.
