statement: >-
  In AIMNet2's first pass an atom's features depend on its neighbours only through per-shell sums Σ_j a_j g_s(r_ij) and
  squared norms of mixed sums Σ_j a_j g_s(r_ij) r̂_ij. Twisting CH₄ from tetrahedral to square planar along the D2d path
  at fixed C–H length keeps every C–H distance and makes the bond vectors sum to zero throughout, so carbon's
  first-pass features cannot change; the hydrogens' do, and the second and third passes pass that on. The released
  ωB97M-D3 checkpoint, run on CPU, shows exactly this.
grade: THEORY
