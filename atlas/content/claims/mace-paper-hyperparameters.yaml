scope: { model_families: [mace] }
verified_against: full-text
review: { status: draft, last_checked: 2026-10-15, notes: 'The appendix text renders the molecular cutoff as "55 Å", almost certainly 5.5 Å; confirm against the PDF before publishing an exact value.' }
