statement: >-
  The models in the MACE paper use two layers, spherical harmonics up to L_max = 3, eight Bessel radial basis functions
  multiplied by a polynomial envelope with p = 5, and a cutoff of a few ångström; correlation orders ν from 1 to 3 are
  compared.
grade: PUBLISHED_RESULT
sources:
