statement: >-
  The MTP of the MLIP package learns its radial functions: f_μ(r) = Σ_β c^{(β)}_{μ,z_i,z_j} Q^{(β)}(r), with Q^{(β)}
  Chebyshev polynomials on [R_min, R_cut] times (R_cut − r)², so the energy is linear in the basis coefficients but not
  in the radial coefficients. The first MTP (2016) fixed the radial functions and was linear in all its parameters.
