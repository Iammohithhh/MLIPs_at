statement: >-
  SpookyNet's nonlocal interaction is self-attention over all atoms, evaluated with the FAVOR+ approximation (positive
  orthogonal random features, f = F of them, drawn once at initialisation and kept fixed so that the model is
  deterministic), which scales linearly with the number of atoms instead of quadratically.
grade: THEORY
