statement: >-
  When (n, l) labels repeat in a correlation, permutation symmetry removes many of the rotation invariants: for
  l = (2, 2, 2, 2, 2) there are 16 rotation invariants but only one rotation- and permutation-invariant function
  when all five n are equal, and for l = (2, 2, 2, 2) with n = (0, 0, 1, 2) three of five remain.
