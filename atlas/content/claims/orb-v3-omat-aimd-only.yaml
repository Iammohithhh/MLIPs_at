statement: >-
  All orb-v3-*-omat models were trained only on the AIMD subset of OMat24, because including the rattled structures hurt
  out-of-distribution behaviour such as diatomic curves; the -mpa models were trained on MPtrj plus Alexandria (PBE) for
  compatibility with benchmarks such as Matbench Discovery, and the authors advise defaulting to -omat.
