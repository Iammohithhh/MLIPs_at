statement: >-
  CHGNet predicts a magnetic moment for every atom by a linear map of the atom features after the third interaction
  block and trains it on DFT moments, so those features carry charge information; the paper uses the predicted moments
  to infer oxidation states (for example Mn4+ and Mn3+ around 3 and 4 μB) and notes that this does not enforce global
  charge neutrality.
