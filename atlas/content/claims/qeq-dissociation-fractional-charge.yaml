statement: >-
  In plain charge equilibration a neutral A–B pair keeps charges ±(χ_B − χ_A)/(J_A + J_B) as the separation goes to
  infinity, because the Coulomb kernel vanishes but the electronegativity difference does not; real atoms separate
  neutral.
grade: THEORY
derivation: /physics-lab/charge-equilibration/#dissociation
