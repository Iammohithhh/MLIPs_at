statement: >-
  A one-hot fidelity concatenated to the input of a linear layer acts as a fidelity-dependent bias. If it enters only where
  the energy is linear in it (an energy shift, or a model linear in fixed descriptors), the fidelities differ by a constant
  for a given composition and predict identical forces and stresses; fidelity-dependent forces need the bias to pass
  through nonlinear layers that also see the geometry.
grade: THEORY
