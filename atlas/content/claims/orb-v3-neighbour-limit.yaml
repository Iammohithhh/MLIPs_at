statement: >-
  Limiting each atom to 20 neighbours reduces Orb's cost but induces subtle discontinuities in the potential energy
  surface, which the authors report as a modest performance penalty for certain workflows and a source of
  non-energy-conserving behaviour even for the conservative -20 model.
