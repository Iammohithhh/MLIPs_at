statement: >-
  The published M3GNet uses a 5 Å graph cutoff, three-body interactions within 4 Å, three main blocks, 64-dimensional
  features and 227,549 learnable weights, and was trained on the MPF.2021.2.8 data (187,687 ionic steps of 62,783
  compounds from Materials Project relaxations).
