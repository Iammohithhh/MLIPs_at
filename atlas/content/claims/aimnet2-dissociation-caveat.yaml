statement: >-
  The AIMNet2 authors name the dissociation of charged complexes as a limiting case: NQE redistributes charge as a function of learned short-range descriptors, so once non-neutral fragments move beyond the message-passing cutoff without intermediary molecules the lack of communication can yield systematic misprediction.
