statement: >-
  Because one-layer GRACE models are local, they can be parallelised by spatial domain decomposition in LAMMPS; the
  authors report that one A100-80GB GPU holds 78,000–215,000 atoms for one-layer and 20,000–55,000 atoms for two-layer
  models, depending on the system.
