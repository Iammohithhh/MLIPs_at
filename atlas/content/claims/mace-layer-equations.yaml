statement: >-
  A MACE layer builds an atomic basis A_i = Σ_j R(r_ij) Y(r̂_ij) W h_j, forms symmetrised ν-fold products B_i of it
  with generalised Clebsch–Gordan coefficients, takes a learned linear combination of B over correlation orders as the
  message, updates the node features linearly with a residual connection, and reads site energies from the invariant
  (L = 0) features of every layer.
