statement: >-
  A pretrained AIMNet2 model ran 2.5 ns of NVT molecular dynamics of 1000 CO₂ molecules at 298 K without instability or
  broken molecules; its self-diffusion coefficient underestimated the interpolated experimental value,
  by a factor comparable to the underestimates of CO₂-specific Deep Potential models.
