statement: >-
  A plain softmax over the neighbours in the cutoff changes discontinuously when an atom enters, and multiplying it by the switch
  does not fix this because every denominator changes; DPA-2 uses softmax*(x_ij) = w_ij softmax(w_ij (x_ij + s*) − s*) with
  s* = 20, and requires the switch w to have a continuous second derivative.
grade: THEORY
