statement: >-
  The SOAP kernel is the overlap of two Gaussian neighbour densities, squared and integrated over all rotations, then
  normalised by the self-overlaps and raised to a positive integer power ζ. Expanding the densities in an orthonormal
  radial basis and spherical harmonics turns the rotation integral into a dot product of power spectra, so SOAP is
  equivalent to the SO(3) power spectrum with Gaussian densities and a dot-product kernel.
