statement: >-
  Trained on bond scans of nine neutral singlet diatomics (H, Li, F, Na, Cl) with an 18 a₀ cutoff, SpookyNet without its
  nonlocal interactions predicted an unphysical step at large separations; with them it reproduced the reference curves.
  The authors note that a larger cutoff only moves the artefact outwards and that the electrostatics and dispersion
  corrections did not remove it in these examples.
