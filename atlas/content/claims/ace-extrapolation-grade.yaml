statement: >-
  For ACE the extrapolation grade of an atom is γ_i = max |B_i · A_active^{-1}|, with the active set chosen by MaxVol
  (D-optimality) and, for nonlinear models, B_i replaced by the derivatives of E_i with respect to the coefficients;
  γ ≤ 1 is interpolation and γ > 1 extrapolation.
