statement: >-
  Orb is an encoder–processor–decoder Graph Network Simulator: each message-passing step updates every edge from the
  concatenation of its features and those of its two nodes, sums the updated edges into the nodes with weights
  sigmoid(w·e) × cutoff(r), and adds both updates as residuals; nodes carry only species embeddings.
grade: PUBLISHED_RESULT
