statement: >-
  The MLIP package uses two thresholds on the extrapolation grade: above γ_select (typically about 2) a configuration is
  kept for training, above γ_break (about 10) the simulation stops. The authors report 1.1 ≲ γ_select ≲ 5 and
  3 ≲ γ_break ≲ 20 as working for every system they tried and advise users to test their own; the 2017 paper found a
  threshold between 2 and 11 a good choice for bulk Li.
