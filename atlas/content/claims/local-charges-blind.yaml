statement: >-
  A charge that is a function of an atom's environment within the model's receptive field cannot change when only atoms outside
  that field change; uniform rescaling to a total charge changes every atom by the same amount. Only a global step such as charge
  equilibration can move charge between distant atoms. This applies to 3G-HDNNP charges and to LES latent charges alike.
grade: THEORY
derivation: /models/long-range/#local-derivation
