statement: >-
  The polynomial envelope u(d) = 1 − (p+1)(p+2)/2·d^p + p(p+2)·d^(p+1) − p(p+1)/2·d^(p+2) satisfies
  u(1) = u′(1) = u″(1) = 0 for every order p, so it is continuous through the second derivative at the cutoff.
