statement: >-
  The polynomial envelope u(d) = 1 − (p+1)(p+2)/2·d^p + p(p+2)·d^(p+1) − p(p+1)/2·d^(p+2), with d = r/r_c, has a
  root of multiplicity 3 at the cutoff, so u, u′ and u″ vanish there for every order p.
