statement: >-
  In Ewald summation the splitting parameter α only moves weight between the real-space sum, the reciprocal-space
  sum and the self term; with converged cutoffs their total is independent of α (for rock salt it reproduces
  M = 1.747565 for α from 0.5 to 3 per r0).
