statement: >-
  SevenNet-MF-0 (PBE/PBE+U plus r²SCAN from the Materials Project) shows strongly softened optical phonons in unary and binary
  crystals compared with r²SCAN and SevenNet-0; the authors attribute this to MP-r²SCAN containing only relaxations started
  from PBE minima, with forces and stresses narrowly distributed around zero.
