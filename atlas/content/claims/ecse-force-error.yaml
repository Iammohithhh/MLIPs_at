statement: >-
  Forces of an ECSE-symmetrised model are not a weighted average of backbone forces, because the frames and weights
  depend on the atomic positions; their error can therefore exceed the backbone's, more so for "tight" ECSE parameters
  that use few frames, and the original paper chose "loose" parameters at a higher cost (its proof-of-principle
  implementation was about three orders of magnitude slower than the backbone).
