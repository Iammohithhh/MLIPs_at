statement: >-
  If a potential energy is invariant under rotations, E(QR) = E(R), then the forces F = −∇E are equivariant,
  F_i(QR) = Q F_i(R): an energy-conserving model built from rotation-invariant energies gets rotation-equivariant
  forces for free.
grade: THEORY
derivation: /physics-lab/rotation/#derivation
