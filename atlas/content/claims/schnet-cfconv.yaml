statement: >-
  SchNet updates atom features with continuous-filter convolutions x_i^{l+1} = Σ_j x_j^l ∘ W^l(r_i − r_j), where the
  filter W is generated by dense layers with shifted-softplus activations, ssp(x) = ln(0.5eˣ + 0.5), from the
  interatomic distance expanded in Gaussians exp(−γ(d_ij − μ_k)²) with centres every 0.1 Å; restricting the filter to
  distances makes the energy rotationally invariant, and forces are its negative gradient.
