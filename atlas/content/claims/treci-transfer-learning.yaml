statement: >-
  TRECI builds constant-potential (electronically grand-canonical) MLIPs by transfer learning from general-purpose and
  domain-specific models; for Cu(111)/water, models trained on about one thousand configurations gave accurate
  molecular dynamics across a wide potential range at meta-GGA level.
