statement: >-
  Materials Project data apply a Hubbard U to some transition metals only when O or F is present, which creates two
  incompatible energy surfaces; MLIPs trained on both interpolate between them, which Warford et al. link to
  underbinding or spurious repulsion between U-corrected metals and O- or F-containing species, and which the
  UniFFBench authors propose as a cause of large bond errors for some frequent transition-metal pairs.
grade: HYPOTHESIS
