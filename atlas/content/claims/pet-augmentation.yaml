statement: >-
  The PET backbones in the original paper were trained with random rotational augmentation (a new uniformly random
  rotation of every sample at each epoch), and ECSE was applied only at inference; the accuracy of the backbone y_0 and
  of the symmetrised model y_S differed minutely on COLL, MnO, HME21 and HEA.
