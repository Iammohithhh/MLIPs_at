statement: >-
  Under fully periodic boundary conditions a slab carrying a surface dipole density p is accompanied by an artificial
  uniform field p/(ε₀L_z) through the vacuum (and the slab), which decays only as 1/L_z with the cell length; a
  dipole-layer correction removes it and leaves a potential step p/ε₀ across the dipole layer.
grade: THEORY
