statement: >-
  Fine-tuning GRACE-2L-OAM on a hydrogen-combustion dataset with all weights trainable caused catastrophic forgetting on
  the original sAlex data for all elements, while training only the ACE expansion coefficients (which depend on the
  central atom's species) left predictions unchanged for structures without H or O and raised errors much less.
