statement: >-
  After every charge update AIMNet2 applies neural charge equilibration: q_i = q̃_i + f_i (Q − Σ_j q̃_j) / Σ_j f_j, with non-negative weights f predicted alongside the charges, so the charges add up to the given total charge by construction. The scheme comes from AIMNet-NSE, whose authors relate f to atomic Fukui functions ∂q/∂Q.
grade: THEORY
