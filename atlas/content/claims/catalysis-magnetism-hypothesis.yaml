statement: >-
  The large errors on Co- and Ni-containing surfaces may come from these metals being magnetic combined with how spin
  polarisation was treated when the training data sets were prepared; models that use magnetic moments or spin as an
  explicit input (CHGNet, AQCat) are less affected.
