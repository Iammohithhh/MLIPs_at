statement: >-
  In 300 K MD of bcc Li with an MTP of 100 basis functions, the RMS force error of 95 % of time steps lay between
  0.04 γ and 0.22 γ eV/Å, so the extrapolation grade predicted the order of magnitude of the error without a DFT
  calculation.
