statement: >-
  With its published silicon parameters the Stillinger–Weber potential gives diamond silicon at a = 5.431 Å an energy
  of −2ε = −4.3366 eV per atom, all from two-body terms: every bond angle is tetrahedral, so the three-body term is
  exactly zero.
grade: THEORY
