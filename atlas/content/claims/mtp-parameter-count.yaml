statement: >-
  A single-species mlip-2 template has (number of basis functions) + 1 constant + (radial functions × radial basis size)
  free parameters; with the templates' 8 Chebyshev functions this gives 125, 329 and 913 parameters at levels 16, 20
  and 24, the numbers listed for the Li, the Ni/Cu/Mo and the Si/Ge MTPs of Zuo et al.
grade: THEORY
derivation: /models/mtp/#fig-basis
sources:
