statement: >-
  Graph ACE's cluster functions are defined with pairwise different atoms, but local ACE may sum without that
  restriction because the resulting self-interactions can be absorbed by renormalising lower body-order coefficients,
  which enables efficient implementations. The recursive GRACE evaluation also includes self-interactions; for four-atom
  Si clusters, models with self-interacting basis functions of more edges than the cluster has bonds keep lowering the
  test error.
grade: PUBLISHED_RESULT
