statement: >-
  GAP writes the total energy as a sum of local energies with compact support inside a cutoff, plus optional long-range
  terms, and regresses each local energy with a Gaussian process. Because quantum-mechanical calculations give only
  total energies and their derivatives, the covariance of two total energies is the double sum of the kernel over the
  atoms of both configurations, and forces and virials enter through derivatives of that covariance.
