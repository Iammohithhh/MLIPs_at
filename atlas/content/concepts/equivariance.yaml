title: Invariance and equivariance
summary: >-
  Rotating a structure must leave its energy unchanged (invariance) and rotate its forces, dipoles and other
  vectors with it (equivariance). Invariant models build features only from distances and angles; equivariant models
  also carry vector and tensor features that co-rotate.
