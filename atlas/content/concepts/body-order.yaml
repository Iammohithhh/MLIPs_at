title: Body order
summary: >-
  The number of atoms a single energy term depends on at once: pairs (2-body), angles (3-body), dihedrals and beyond.
  Pair potentials cannot encode bond angles; descriptor and message-passing MLIPs reach high body order, MACE and ACE
  by taking products of atomic basis functions.
