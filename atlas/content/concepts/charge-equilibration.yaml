title: Charge equilibration
summary: >-
  Assigns partial charges by letting charge flow until every atom has the same effective electronegativity, given
  per-atom electronegativities, hardnesses and a Coulomb kernel. Used as a long-range layer in several MLIPs, with
  environment-dependent parameters predicted by a network.
